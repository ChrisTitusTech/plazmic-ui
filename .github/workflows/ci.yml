---
name: CI

'on':
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Source, tests, and documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes pipx rsync shellcheck shfmt

      - name: Install pinned contributor tools
        run: |
          pipx install ruff==0.15.21
          npm install --global markdownlint-cli2@0.23.0

      - name: Run complete gate
        run: make check

---
name: Feature request
description: Propose a focused local UI editing improvement.
title: "feature: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: >-
        Describe the user-visible limitation without private game data.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Proposed outcome
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: >-
            This does not require bundled Daybreak assets or personal layouts.
          required: true
        - label: >-
            This does not add injection, binary patching, or gameplay
            automation.
          required: true
